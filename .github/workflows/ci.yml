name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Speelbare versie zonder installatie: één HTML-bestand, te downloaden onder "Artifacts" van deze run.
      - run: npm run build:single
      - uses: actions/upload-artifact@v7
        with:
          path: dist-single/metro-manager.html
          archive: false
          retention-days: 30
